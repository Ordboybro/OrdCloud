name: OrdCloud CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "screenshots/**"
      - "README.md"
  pull_request:
    branches: [main]

concurrency:
  group: ordcloud-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile project sources
        run: python -m compileall -q main.py config.py modules ui

      - name: Run storage tests
        run: python -m unittest discover -s tests -v

      - name: Smoke-test the UI
        env:
          QT_QPA_PLATFORM: offscreen
        run: >-
          python -c "from PySide6.QtWidgets import QApplication; from ui.main_window import MainWindow;
          app=QApplication([]); window=MainWindow(); window.close(); print('UI smoke test: OK')"
