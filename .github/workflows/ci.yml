name: OrdCloud CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile project sources
        run: python -m compileall -q main.py config.py modules ui

      - name: Run storage tests
        run: python -m unittest discover -s tests -v

      - name: Verify UI imports
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -c "from ui.main_window import MainWindow; print('UI import: OK')"
